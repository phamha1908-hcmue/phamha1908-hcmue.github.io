<!DOCTYPE html>
<html>
<head>
  <title>Hồ cá vui nhộn</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mystyle.css">
</head>
<body>
  <a id="vetrangchu" href="../index.html">← Về trang chủ</a>

  <div id="content" class="nen1">
    <div class="dieukhien">
      <button class="nut" onclick="doiNen()">Đổi cảnh nền</button>
      <button class="nut" id="nutNhac" onclick="phatNhac()">Phát nhạc</button>
    </div>

    <div id="shark" class="sinhvat"><img src="images/shark.png" width="auto" height="auto"></div>
    <div id="turtle" class="sinhvat"><img src="images/turtle.png"></div>
    <div id="faint" class="sinhvat"><img src="images/faintSchool.png"></div>
    <div id="gold" class="sinhvat"><img src="images/goldFishSchool.png"></div>
    <div id="diver1" class="sinhvat"><img src="images/diver1.png"></div>
    <div id="diver2" class="sinhvat"><img src="images/diver2.png"></div>
    <div id="diver3" class="sinhvat"><img src="images/diver3.png"></div>
  </div>

  <audio id="nhac" src="music.wav" loop></audio>

  <script>
    var dem = 0;
    var dsNen = ["nen1", "nen2", "nen3", "nen4"];

    function doiNen() {
      dem = (dem + 1) % 4;
      document.getElementById("content").className = dsNen[dem];
    }

    function phatNhac() {
      var a = document.getElementById("nhac");
      var n = document.getElementById("nutNhac");
      if (a.paused) {
        a.play();
        n.innerHTML = "Ngừng nhạc";
      } else {
        a.pause();
        n.innerHTML = "Phát nhạc";
      }
    }
  </script>
</body>
</html>
